<!DOCTYPE html><html lang="ja"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Couple Match</title>    <link rel="stylesheet" href="style.css">    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"></head><body>    <div id="app">        <div id="auth-screen" class="screen active">            <div class="glass-card">                <h1>💞 名前でマッチング 💞</h1>                <p class="subtitle">ひらがな・カタカナのみ</p>                                <form id="auth-form">                    <div class="input-group">                        <label>あなたの名前</label>                        <div class="name-inputs">                            <input type="text" id="last-name" required placeholder="姓 (例：やまだ)" pattern="^[ぁ-んァ-ヶー]+$">                            <input type="text" id="first-name" required placeholder="名 (例：たろう)" pattern="^[ぁ-んァ-ヶー]+$">                        </div>                        <small>※ひらがな・カタカナのみ</small>                    </div>                                        <div class="input-group">                        <label for="password">パスワード</label>                        <input type="password" id="password" required>                    </div>
                    <div class="input-group" id="additional-info-group" style="display: none;">                        <label for="additional-info">追加情報</label>                        <input type="text" id="additional-info" placeholder="学校名やクラスなど">                        <small>同じ名前の方が既にいるため、相手があなただと分かる情報を入力してください。</small>                    </div>
                    <div id="auth-error" class="error-msg"></div>                                        <button type="submit" class="btn primary-btn">はじめる (登録 / ログイン)</button>                </form>            </div>        </div>
        <div id="main-screen" class="screen">            <div class="glass-card">                <div class="header">                    <h2><span id="display-name"></span> さん</h2>                    <button id="logout-btn" class="btn text-btn">ログアウト</button>                </div>                                <div class="status-box" id="status-box">                    <p>意中のお相手を指名しましょう！</p>                </div>
                <div class="nominate-section">                    <h3>💘 思っている相手は？</h3>                    <form id="nominate-form">                        <div class="input-group">                            <label>片思い相手の名前 (ひらがな・カタカナ)</label>                            <div class="name-inputs">                                <input type="text" id="partner-last-name" required placeholder="姓 (例：すずき)" pattern="^[ぁ-んァ-ヶー]+$">                                <input type="text" id="partner-first-name" required placeholder="名 (例：はなこ)" pattern="^[ぁ-んァ-ヶー]+$">                            </div>                        </div>                                                <div id="nominate-error" class="error-msg"></div>
                        <button type="submit" class="btn secondary-btn">思い人変更</button>                    </form>                </div>            </div>        </div>
        <div id="selection-modal" class="modal">            <div class="modal-content glass-card">                <h3>👥 同姓同名の方が複数います</h3>                <p class="subtitle">指名する相手を選択してください。</p>                <div id="selection-list" class="selection-list">                    </div>                <button id="cancel-selection-btn" class="btn text-btn">キャンセル</button>            </div>        </div>    </div>
    <script type="module" src="app.js"></script></body></html>
